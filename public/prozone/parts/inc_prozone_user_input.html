<%init>
	use utf8;

	my %args = $m->caller_args(0);

	my $email   = $args{email};
	my $token   = $args{token} // '';
</%init>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

		<div class="rounded-2xl border border-gray-200 bg-white p-5">
				<h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">Zugang anfordern</h2>
				<p class="text-sm text-gray-500 mb-6 sm:min-h-10">Wir prüfen Ihre Anfrage und melden uns zeitnah.</p>

				<form method="post" onsubmit="event.preventDefault(); sendProzoneRequest(this);">
				<input type="hidden" name="bGo" value="1">

				<div class="mb-4">
					<label class="block text-sm font-medium text-gray-700 mb-1" for="txe_99">
						Ihre Firmen-E-Mail-Adresse
					</label>
					<input placeholder="name@firma.ch" name="email" type="email" id="txe_99" required
						autocomplete="email" value="<% $email %>"
						class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
							focus:outline-none focus:ring-2 focus:ring-red-500 transition">
				</div>

				<button type="submit" id="btn309200"
					class="w-full mt-2 sm:w-auto inline-flex items-center justify-center bg-[#1c1512]
						hover:bg-red-600 text-white text-sm font-semibold px-6 py-2.5 rounded-full
						shadow transition-colors
						disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-[#1c1512]">
					<span id="btn309200-label">Zugang zu Pro-Zone anfordern</span>
				</button>
				</form>
		</div>

		<div class="rounded-2xl border border-gray-200 bg-white p-5">
				<h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">Haben Sie bereits ein Token?</h2>
				<p class="text-sm text-gray-500 mb-6 sm:min-h-10">Geben Sie Ihr PRO-Zone-Token ein, um direkt fortzufahren.</p>

				<form method="post">
				<div class="mb-4">
					<label class="block text-sm font-medium text-gray-700 mb-1" for="prozone-token">Token</label>
					<input type="text" name="token" id="prozone-token" placeholder="z. B. 8f3a-29c1" value="<% $token %>"
						class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
							focus:outline-none focus:ring-2 focus:ring-red-500 transition">
				</div>

				<button type="submit"
					class="w-full mt-2 sm:w-auto inline-flex items-center justify-center bg-[#1c1512]
						hover:bg-red-600 text-white text-sm font-semibold px-6 py-2.5 rounded-full
						shadow transition-colors">
					Eingabe bestätigen
				</button>
				</form>
		</div>

</div>
