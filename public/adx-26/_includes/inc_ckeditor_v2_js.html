<%init>
	my %args = $m->caller_args(0);

	my $height = $args{height} || 300;
</%init>
<script>
			// DN309221-X2
			var editor;

			function createEditor( languageCode ) {
				if ( editor )
					editor.destroy();

				editor = CKEDITOR.replace( 'editor1', {
					filebrowserBrowseUrl: '_browser_browse.html',
					filebrowserUploadUrl: '_uploader_upload.html',
					language: 'de',
					height: <% $height %>,
					extraAllowedContent: 'h1[*]{*}(*); ul li[*]{*}(*); td[height]',
% #					contentsCss: [ 'lib/bootstrap/css/bootstrap.min.css' ],

					on: {
						instanceReady: function() { }
					}
				});
			}

			// At page startup, load the default language:
			createEditor( '' );
</script>
