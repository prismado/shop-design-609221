<%init>
	use ScreenPoint::Core;

	my $C = ScreenPoint::Core->new( $r, $m );

	my $cgi = $C->{CGI};
	my $id     = $cgi->param('id') + 0;
	my $css_id = $cgi->param('css_id') || 'exampleModalFull';
</%init>
<div class="modal fade" id="<% $css_id %>" tabindex="-1" role="dialog" aria-labelledby="<% $css_id %>" aria-hidden="true">
	<div class="modal-dialog modal-md modal-dialog-centered" role="document">

		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="<% $css_id %>">Produkt zu Promos hinzuf&uuml;gen</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span class="fi fi-close fs--18" aria-hidden="true"></span>
				</button>
			</div>

			<div class="modal-body">
			    <form method="post" action="/_sub.html" name="f402172_24_<% $$ %>">
				<input type="hidden" name="action"  value="add_promo">
				<input type="hidden" name="prod_id" value="<% $id %>">

				<label class="form-radio form-radio-success">
					<input type="radio" name="is_active" value="1" checked>
					<i class="mt-1"></i>
				</label> Promo<br>

				<label class="form-radio form-radio-success">
					<input type="radio" name="is_active" value="-1">
					<i class="mt-1"></i>
				</label> Super-Promo / Tagesangebot

				<div class="form-label-group mb-3 mt-2">
					<input required="" placeholder="" id="txe_weight" name="weight" type="text" class="form-control" value="75">
					<label for="txe_weight">Reihenfolge / Gewicht (je kleiner der Wert desto weiter oben)</label>
				</div>
			    </form>
			</div>

			<div class="modal-footer">
				<button type="button" class="btn btn-sm btn-soft btn-secondary w--150" data-dismiss="modal">
					<i class="fi fi-close"></i> Abbrechen
				</button>

				<button type="button" class="btn btn-sm btn-soft btn-primary w--150" onclick="document.f402172_24_<% $$ %>.submit();">
					<i class="fi fi-check"></i> Zuweisen
				</button>
			</div>
		</div>

	</div>
</div>

<script language="JavaScript">
	function pick_prod_id(id) {
		document.f402172_24_<% $$ %>.prod_id.value=id
	}
<%doc>
	$(document).ready(function(){
		setTimeout(function() {
			document.f402172_24_<% $$ %>.prod_id.focus();
		}, 500);

	});
</%doc>
</script>
