<%init>
	my %args = $m->caller_args(0);
	my $C = $args{C};
	my $A = $args{A};

	my $amount = $C->query("select val from properties where `key`='shipping_v3_amount_sys'")->[0];
</%init>

<h2>Shipping Model 3</h2>

<form method="post">

Amount: <b><% $C->{CONFIG}->{default_curr} %> <% sprintf('%.2f', $amount) %></b><br><br>

<input style="width:88px; margin-top:10px; text-align:right; padding-right:20px"
	type="text" value="<% sprintf('%.2f', $amount) %>" name="amount">

<input name="bUpdate" type="submit" class="btn btn-primary" value="Update">
<input type="button" class="btn" value="Back" onclick="document.location='adm_shipping.html'">

</form>
