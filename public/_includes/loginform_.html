<%init>
	my %args = $m->caller_args(0);
	my $C = $args{CORE};
</%init>
%
% # -- Loginform (links)
%

% if ($C->is_logged_in()) {
<table width="100%" border="0" cellpadding="0" cellspacing="0" class="infoBoxContents">
  <tbody>
    <tr>
      <td colspan="2" height="5"></td>
    </tr>
    <tr>
      <td height="13" colspan="2" class="categor">Eingelogged als <% $C->whoami() %></td>
    </tr>
      <tr>
      <td height="13" class="infoBox"><A class="categor" href='#logout' onclick='JavaScript:document.logoutForm.submit()'>Logout</A></td>
      <td></td>
    </tr>
    <tr>
      <td colspan="2" height="5"></td>
    </tr>
  </tbody>
</table>

% }
% else {

<table width="100%" border="0" cellpadding="0" cellspacing="0" class="infoBoxContents">
  <tbody>
    <tr>
      <td colspan="2" height="5"></td>
    </tr>
    <tr>
      <td height="13" colspan="2" class="infoBox"><% $C->p('username') %></td>
    </tr>
    <tr>
      <td width="72%" height="19"><A class="categor" href="#">
	<input name="Benutzername2" type="text" class="inputform"></A></td>
      <td width="28%">&nbsp;</td>
    </tr>
    <tr>
      <td height="13" class="infoBox"><% $C->p('password') %></td>
      <td></td>
    </tr>
    <tr>
      <td><input name="text23" type="text" class="inputform"></td>
      <td><a href="#"><img src="images/ok_orange.gif" alt="" width="34" height="22" border="0"></a></td>
    </tr>
    <tr>
      <td colspan="2"><a href="registration.html" class="categor"><% $C->p('registration') %>?</a></td>
    </tr>
  </tbody>
</table>

% }
