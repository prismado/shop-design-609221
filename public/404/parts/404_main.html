<%init>
	use utf8;

	my %args = $m->caller_args(0);

	my $perm = $args{perm};
	my $C    = $args{C};
	my $A    = $args{A};
</%init>

	<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-10">

		<div>
			<img src="https://placehold.co/400x200/d8d8d8/a8a8a8?text=Kein%0ABild"
				class="w-full rounded-2xl object-cover border border-gray-200 bg-white"
				loading="lazy">

			<div class="mt-6">
				<h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">Beschreibung</h2>
				<p class="text-sm text-gray-600 leading-relaxed">tbd</p>
			</div>
		</div>

		<div>
			<p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Tbd xx</p>
			<h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Seite nicht gefunden</h1>
		</div>

	</div>

	<!-- daily_offer.html wird hier ausserhalb der sonst üblichen 3-Spalten-Sidebar als volle Breite
		eingebunden. Damit die Tagesangebote-Karten trotzdem nebeneinander statt riesig untereinander
		erscheinen, wird NUR von hier aus die interne Grid-Spaltenzahl überschrieben — daily_offer.html
		selbst bleibt unverändert. -->
	<style>
		@media (min-width: 1024px) {
			#tagesangebote .grid {
				grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
			}
		}
	</style>

	<& ../partials/daily_offer.html, C => $C, A => $A &>
