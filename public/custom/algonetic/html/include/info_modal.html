<%init>
	use ScreenPoint::Core;
	use ScreenPoint::Auctionline;
	my $C = ScreenPoint::Core->new( $r, $m );
	my $A = ScreenPoint::Auctionline->new($C);

	my $SID = $C->getSID();

	my $lang = $C->getSessData('_current_lang') || 'de';

</%init>
<!-- Info Modal -->
<script>
$(document).ready(function(){
	$('#infoModal').modal('show')
});
</script>
<!-- Modal body  -->
<div id="infoModal" class="modal hide fade ps-modal-back" style="background-image: url('images/christmas-back.jpg');" tabindex="-1" role="dialog" aria-labelledby="infoModalLabel" aria-hidden="true">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
    <h4 id="infoModalLabel"><% $C->prop('informations') %></h4>
  </div>
  <div class="modal-body">
    <p><% $C->prop('modal_text') %></p>
  </div>
  <div class="modal-footer">
    <button class="btn" data-dismiss="modal" aria-hidden="true"><% $C->prop('close') %></button>
  </div>
</div>
