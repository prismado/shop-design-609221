<%init>

	my $lang = $args{lang} || 'de';

	my $HOST = $C->{CONFIG}->{HTTP_HOST} || $ENV{HTTP_HOST};
</%init>

	<% $C->web_enc($C->get_property('closing_greeting', '_global', $lang)) %><br>

	<% $C->web_enc($C->render_property('contact_adress', $lang)) %>

	<a href="https://<%$HOST%>" target="_blank"><%$HOST%></a>
