<%init>
	my %args = $m->caller_args(0);

	my $name   = $args{name};
	my $choice = $args{choice}; # -- Ja||Nein
	my $C      = $args{C};

	my @choices = split /\|\|/, $choice;

	my $checked = $args{checked} // $C->getSessData($name);
</%init>
<%doc>
<div class="checkbox">
    <label class="form-switch form-switch-success d-block">

	<input type="checkbox" id="<% $name %>" name="<% $name %>" <% $args{disabled} ? 'disabled' : '' %>
		onclick="click_cb_<% $name %>()" <% $checked ? 'checked' : '' %> value="<% $choices[0] %>">
	<i data-on="&#10004; Ja" data-off="&#10005;"></i>

	<label for="<% $name %>">
		<% $args{label} %><span class="font-weight-bold ml-2" id="cur_choice_<% $name %>"></span>
	</label>

    </label>
</div>
</%doc>

<label class="flex items-start gap-3 cursor-pointer ZZselect-none">
	<input type="checkbox" class="toggle shrink-0" id="<% $name %>" name="<% $name %>"
		value="<% $choices[0] %>"
		<% $checked ? 'checked' : '' %>
		<% $args{disabled} ? 'disabled' : '' %>
	>
	<span class="text-sm text-gray-800 leading-snug">
		<% $args{label} %><span class="font-weight-bold ml-2" id="cur_choice_<% $name %>"></span>
		<span class="text-xs text-gray-500">(immex aktiv)</span>
	</span>
</label>

<script language="JavaScript">
	var checked_<% $name %> = <% $checked ? 1 : 0 %>
	function click_cb_<% $name %> () {
		if (checked_<% $name %> == 1) {
			document.getElementById('cur_choice_<% $name %>').innerHTML='<% $choices[1] %>'
			checked_<% $name %> = 0
		}
		else {
			document.getElementById('cur_choice_<% $name %>').innerHTML='<% $choices[0] %>'
			checked_<% $name %> = 1
		}
	}
</script>
