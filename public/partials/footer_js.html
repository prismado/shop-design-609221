<%init>
	use utf8;
</%init>

<script>
  // Höhe des fixierten Headers messen, damit das Navigationsmenü direkt darunter andockt
  function updateHeaderHeight() {
    const header = document.querySelector('header');
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }
  updateHeaderHeight();
  window.addEventListener('resize', updateHeaderHeight);
  window.addEventListener('load', updateHeaderHeight);

  // Sprachauswahl
  const langBtn = document.getElementById('lang-btn');
  const langMenu = document.getElementById('lang-menu');
  const langCurrent = document.getElementById('lang-current');
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langMenu.classList.toggle('hidden');
  });
  document.querySelectorAll('.lang-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      langCurrent.textContent = opt.dataset.code;
      langMenu.classList.add('hidden');
    });
  });
  document.addEventListener('click', () => langMenu.classList.add('hidden'));

  // Warenkorb
  let cartCount = 0;
  const cartBadge = document.getElementById('cart-count');
  document.querySelectorAll('.cart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      cartCount++;
      cartBadge.textContent = cartCount;
      cartBadge.classList.remove('pop');
      void cartBadge.offsetWidth;
      cartBadge.classList.add('pop');
    });
  });

  // Merkliste
  let wishlistCount = 0;
  const wishlistBadge = document.getElementById('wishlist-count');
  document.querySelectorAll('.wishlist-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const svg = btn.querySelector('svg');
      const active = svg.classList.toggle('text-red-500');
      svg.classList.toggle('text-gray-600');
      svg.setAttribute('fill', active ? 'currentColor' : 'none');
      wishlistCount += active ? 1 : -1;
      wishlistBadge.textContent = wishlistCount;
      wishlistBadge.classList.remove('pop');
      void wishlistBadge.offsetWidth;
      wishlistBadge.classList.add('pop');
    });
  });

  // Scroll-Reveal-Animation
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
