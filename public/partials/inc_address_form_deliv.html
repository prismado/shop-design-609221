<%init>
	use utf8;
	my %args = $m->caller_args(0);

	my $id      = $args{id};
	my $on_save = $args{on_save};
</%init>

<form id="<% $id %>-form" class="space-y-4" onsubmit="event.preventDefault();">

	<div>
		<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-gender_2">Anrede</label>
		<select id="<% $id %>-gender_2" name="gender_2"
			class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
				focus:outline-none focus:ring-2 focus:ring-red-500 transition">
			<option value="Herr">Herr</option>
			<option value="Frau">Frau</option>
		</select>
	</div>

	<div class="grid grid-cols-2 gap-3">
		<div>
			<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-firstname_2">Vorname</label>
			<input id="<% $id %>-firstname_2" name="firstname_2" type="text" required
				class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
					focus:outline-none focus:ring-2 focus:ring-red-500 transition">
		</div>
		<div>
			<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-lastname_2">Nachname</label>
			<input id="<% $id %>-lastname_2" name="lastname_2" type="text" required
				class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
					focus:outline-none focus:ring-2 focus:ring-red-500 transition">
		</div>
	</div>

	<div>
		<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-company_2">
			Firma <span class="text-gray-400 font-normal">(optional)</span>
		</label>
		<input id="<% $id %>-company_2" name="company_2" type="text"
			class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
				focus:outline-none focus:ring-2 focus:ring-red-500 transition">
	</div>

	<div>
		<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-street_2">Strasse, Nr.</label>
		<input id="<% $id %>-street_2" name="street_2" type="text" required
			class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
				focus:outline-none focus:ring-2 focus:ring-red-500 transition">
	</div>

	<div class="grid grid-cols-3 gap-3">
		<div>
			<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-zip_2">PLZ</label>
			<input id="<% $id %>-zip_2" name="zip_2" type="text" required
				class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
					focus:outline-none focus:ring-2 focus:ring-red-500 transition">
		</div>
		<div class="col-span-2">
			<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-city_2">Ort</label>
			<input id="<% $id %>-city_2" name="city_2" type="text" required
				class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
					focus:outline-none focus:ring-2 focus:ring-red-500 transition">
		</div>
	</div>

	<div>
		<label class="block text-sm font-medium text-gray-700 mb-1" for="<% $id %>-country_2">Land</label>
		<select id="<% $id %>-country_2" name="country_2"
			class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm text-gray-800
				focus:outline-none focus:ring-2 focus:ring-red-500 transition">
			<option value="CH">Schweiz</option>
			<option value="LI">Liechtenstein</option>
		</select>
	</div>

	<div class="flex justify-end gap-3 pt-2">
		<button type="button" onclick="closeModal('<% $id %>')"
			class="inline-flex items-center justify-center border border-gray-300 hover:border-gray-400
				hover:bg-gray-50 text-gray-700 text-sm font-semibold px-5 py-2.5 rounded-full
				transition-colors">
			Abbrechen
		</button>
		<button type="button" onclick="<% $on_save %>(this.closest('form'))"
			class="inline-flex items-center justify-center bg-[#1c1512] hover:bg-red-600 text-white
				text-sm font-semibold px-6 py-2.5 rounded-full shadow transition-colors">
			Speichern
		</button>
	</div>

</form>
