<%init>
	use ScreenPoint::Core;
	my $C = ScreenPoint::Core->new($r, $m);

	my $title = $C->{CONFIG}->{site_title};
</%init>
<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-40 shadow-md">
  <!-- Oberer Header-Bereich -->
  <div class="bg-[#1c1512]">
    <div class="max-w-[1800px] mx-auto px-4 md:px-6 py-3">
      <div class="flex flex-wrap items-center gap-3 md:gap-6">
        <!-- Logo -->
        <a href="." class="order-1 flex-shrink-0 flex items-center">
          <img src="assets/images/logo_algonetic_big_2026_white.png" alt="ElectroNova Logo" class="h-9 md:h-10 w-auto">
        </a>

        <!-- Suchleiste + Sprache -->
        <div class="order-3 md:order-2 w-full md:w-auto md:flex-1 flex items-center gap-3">
          <div class="relative flex-1 max-w-2xl">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
		stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
			d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
            </span>
            <input type="text" placeholder="Was suchst du?"
              class="w-full rounded-full border-0 bg-white/95 py-2.5 pl-11 pr-4 text-sm text-gray-800 placeholder:text-gray-400 shadow-inner focus:outline-none focus:ring-2 focus:ring-white/80 transition">
          </div>

          <!-- Sprachauswahl -->
          <div class="relative flex-shrink-0" id="lang-wrapper">
            <button id="lang-btn" class="flex items-center gap-1.5 rounded-full bg-red-600/90 hover:bg-red-600 text-white px-3 py-2.5 text-sm font-medium transition">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
              </svg>
              <span id="lang-current">DE</span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </button>
            <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 rounded-xl bg-white shadow-lg ring-1 ring-black/5 py-1.5 text-sm text-gray-700 z-50">
              <button class="lang-opt block w-full text-left px-4 py-2 hover:bg-red-50" data-code="DE">Deutsch</button>
              <button class="lang-opt block w-full text-left px-4 py-2 hover:bg-red-50" data-code="FR">Français</button>
              <button class="lang-opt block w-full text-left px-4 py-2 hover:bg-red-50" data-code="IT">Italiano</button>
              <button class="lang-opt block w-full text-left px-4 py-2 hover:bg-red-50" data-code="EN">English</button>
            </div>
          </div>
        </div>

        <!-- Rechte Buttons -->
        <div class="order-2 md:order-3 ml-auto md:ml-0 flex items-center gap-1.5 md:gap-2">
          <a href="#tagesangebote" class="flex items-center gap-1.5 rounded-full px-3 py-2 text-sm font-semibold text-white hover:text-red-400 hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
            </svg>
            <span class="hidden sm:inline">Tagesangebote</span>
          </a>
          <a href="#" class="flex items-center gap-1.5 rounded-full px-3 py-2 text-sm font-medium text-white hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <span class="hidden sm:inline">Anmelden</span>
          </a>
          <button class="relative flex items-center rounded-full p-2.5 text-white hover:bg-white/10 transition" aria-label="Meine Merkliste">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
            <span id="wishlist-count" class="absolute -top-0.5 -right-0.5 bg-white text-red-600 text-[10px] font-bold rounded-full w-4.5 h-4.5 min-w-[18px] h-[18px] flex items-center justify-center">0</span>
          </button>
          <button class="relative flex items-center rounded-full p-2.5 text-white hover:bg-white/10 transition" aria-label="Warenkorb">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.836l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.87-4.788 2.13-7.393a1.115 1.115 0 0 0-1.115-1.256H6.14M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>
            <span id="cart-count" class="absolute -top-0.5 -right-0.5 bg-white text-red-600 text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center">0</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Unterbereich -->
  <div class="bg-neutral-200">
    <div class="max-w-[1800px] mx-auto px-4 md:px-6 py-2 flex flex-wrap justify-center md:justify-between items-center gap-x-8 gap-y-1.5 text-xs md:text-sm text-neutral-700">
      <div class="flex items-center gap-1.5 font-semibold">
        <span>Ein Demoshop für IT-Markenprodukte</span>
      </div>
      <div class="flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 flex-shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.75h-.152c-3.196 0-6.1-1.248-8.25-3.286Z" />
        </svg>
        <span>2 Jahre Garantie auf Neugeräte - 12 Monate Garantie auf Occasion-Geräte!</span>
      </div>
      <div class="flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 flex-shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
        </svg>
        <span>Versand am Folge-Werktag</span>
      </div>
    </div>
  </div>
</header>
