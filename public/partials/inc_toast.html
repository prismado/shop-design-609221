	use utf8;

% # <!-- Toast: Rückmeldung (oben mittig, temporär) -->

<div id="toast-1" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden w-[90vw] max-w-sm items-start gap-3
			rounded-xl border px-4 py-3 shadow-lg opacity-0 -translate-y-2 transition-all duration-300 ease-out">

	<span class="toast-icon-success hidden flex-shrink-0 mt-0.5 text-green-600">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
			stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
			<path stroke-linecap="round" stroke-linejoin="round"
				d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
		</svg>
	</span>

	<span class="toast-icon-error hidden flex-shrink-0 mt-0.5 text-red-600">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
			stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
			<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
		</svg>
	</span>

	<p class="toast-text text-sm leading-snug whitespace-pre-line"></p>
</div>
